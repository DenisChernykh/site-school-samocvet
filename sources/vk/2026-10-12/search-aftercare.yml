                    - generic [ref=f3e1344] [cursor=pointer]:
                      - generic [ref=f3e1346]:
                        - text: ГРУППА ПРОДЛЕННОГО ДНЯ
                        - img "🌻" [ref=f3e1347]
                        - text: "Уважаемые родители! Мы знаем, как важен для вас не только академический результат, но и гармоничная, творческая среда для развития личности вашего ребёнка. Предлагаем вам дополнить вашу образовательную траекторию нашей группой продлённого дня, созданной в духе вальдорфской педагогики! Это прекрасная возможность для ваших детей:"
                        - img "🌻" [ref=f3e1348]
                        - text: Получить полноценную среду для социализации в разновозрастной группе, где ценят индивидуальность каждого.
                        - img "🌻" [ref=f3e1349]
                        - text: Восполнить «дефицит» коллективного творчества и живого, нецифрового общения.
                        - img "🌻" [ref=f3e1350]
                        - text: "Стать частью сообщества единомышленников, где ценят осознанность, уважение и сотрудничество. Чем мы будем заниматься? Всём, что сложнее организовать в одиночку, но что так важно для детей:"
                        - img "🍁" [ref=f3e1351]
                        - text: "Рукоделие и ремёсла: общие проекты, где дети учатся помогать друг другу."
                        - img "🍁" [ref=f3e1352]
                        - text: Прогулки-исследования и активные игры на свежем воздухе в компании друзей.
                        - img "🍁" [ref=f3e1353]
                        - text: "Круговые танцы и ритмические игры: развитие чувства ритма и сплочённости без соревнований."
                        - img "🍁" [ref=f3e1354]
                        - text: "Театральные постановки: совместное создание сказки от идеи до воплощения — идеальный тренинг коммуникации."
                        - img "🍁" [ref=f3e1355]
                        - text: "Книжный клуб и дискуссии: учимся аргументировать свою точку зрения и слышать других."
                        - img "🍁" [ref=f3e1356]
                        - text: "Кулинарные мастер-классы: развитие самостоятельности и командной работы с вкусным результатом!"
                        - img "🍁" [ref=f3e1357]
                        - text: Настольные игры и полюбившаяся детям игра в глину! А также вкусные обеды, полезные перекусы и выполнение домашних заданий;
                        - img "☀" [ref=f3e1358]
                        - text: Мы находимся в Екатеринбурге, Ботанический район, ул.Родонитовая. д.9.
                        - img "☀" [ref=f3e1359]
                        - text: "Записаться на продленку можно у Татьяны по телефону: +79193415744 (вотсап) Пожалуйста, расскажите вашим знакомым о нашей группе продленного дня! Возможно, именно им она пригодится!______________________________ Вальдорфская инициатива - сообщество САМОЦВЕТ место, куда дети идут с радостью"
