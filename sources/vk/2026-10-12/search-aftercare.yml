                      - generic [ref=f3e1486]:
                        - text: ЧТО В ПОРТФЕЛЕ У ВАЛЬДОРФСКОГО УЧЕНИКА?Сегодня предлагаем заглянуть в портфели наших учеников. Что же там?
                        - img "☀" [ref=f3e1487]
                        - text: ЭПОХАЛЬНЫЕ ТЕТРАДИ.В " вальдорфской " педагогике знания передаются устно, поэтому нет потребности носить с собой много тяжелых учебников. Вместо этого в портфеле можно найти тетради формата А4. По русскому языку, математике, а также по самым разным эпохам. Дети сами оформляют их обложки и содержание. Причем зачастую они хранятся в школе, а забираются только те, которые нужны для выполнения домашних заданий.
                        - img "☀" [ref=f3e1488]
                        - text: КНИГИ.Также в портфеле могут быть книги по чтению и литературе - собрания стихотворений, мифы, легенды, сказания.
                        - img "☀" [ref=f3e1489]
                        - text: КАРАНДАШИ И МЕЛКИ.Все художественные материалы, которые даются детям, должны быть самого лучшего качества. Карандаши и восковые мелки для оформления тетрадей, краски и бумага для живописи заказываются в специальном магазине.
                        - img "☀" [ref=f3e1490]
                        - text: ПЕНАЛЫ.То, что сделано своими руками - всегда дарит душевное тепло и уверенность в своих силах. Поэтому пеналы для школьных принадлежностей и чехлы для флейт вяжутся или шьются родителями или руками самих учеников.
                        - img "☀" [ref=f3e1491]
                        - text: ФЛЕЙТЫ.Конечно же, сами флейты. Пентатоническая - в первых классах. Затем - диатоническая. Которыми звучат на уроках музыки.Зачастую у детей можно найти что-нибудь творческое. Рисунки, схемы, изобретенные ими проекты, начатые работы по рукоделию - так кипит жизнь на переменах и продленке. Бывают и заботливо положенные мамой полезные перекусы - орехи, фрукты, пирожки. Но в целом, портфели у детей - не тяжелые, и наполнены вдохновением, что позволяет учиться - с радостью!
