                  - generic [ref=f3e1256]:
                    - generic [ref=f3e1259] [cursor=pointer]:
                      - generic [ref=f3e1261]:
                        - text: ДОНАБОР в 1, 2, 4, 5, 6 и 7 классы
                        - img "🔥" [ref=f3e1262]
                        - text: До сентября осталось чуть меньше месяца, и если вы до сих пор не определились, куда пойдет ребенок, приглашаем присмотреться ближе к нашей семейной вальдорфской школе!Мы — не образовательное учреждение в привычном смысле. Мы — родительская семейная инициатива, живое сообщество, которое девять лет назад создали такие же мамы и папы, как и вы. Мы объединились, чтобы наши дети росли и учились целостно, творчески, в уважении. И в этом — наша большая сила.
                        - img "🌿" [ref=f3e1263]
                        - text: Дети чувствуют, что их окружает не система, а сообщество близких по духу взрослых.
                        - img "🌿" [ref=f3e1264]
                        - text: В основе обучения - вальдорфская педагогика, которая учитывает глубинные потребности ребенка (согласно возрасту, индивидуальному развитию и ситуации) и позволяет ему пройти путь становления личности целостно, с 1 по 11 класс.
                        - img "🌿" [ref=f3e1265]
                        - text: "Жизнь учеников наполнена искусствами: помимо основных качественно организованных предметов есть \"живопись\", \"пластицирование\", \" ручной художественный труд\", \"музыка\", которые помогают раскрываться душевным качествам и обогащают внутреннюю культуру ребенка."
                        - img "🌿" [ref=f3e1266]
                        - text: Благодаря этому в расписании получается поддерживать здоровый баланс между предметами творческой направленности и мыслительной деятельности, что способствует укреплению здоровья ребёнка . Музыка, например, помогает развитию чувства речи и лучшему усвоению иностранных языков, художественный труд - формированию воли, а живопись и рисунок ведут к развитию логики и подвижности мышления.
                        - img "🌿" [ref=f3e1267]
                        - text: Обучение начинается с 8.30, а заканчивается с 13.00 до 15.00 в зависимости от возраста. После по запросам родителей организуется продленка, во время которой ребята гуляют, выполняют дз, играют, рукодельничают и отлично проводят время.КАК С НАМИ ПОЗНАКОМИТЬСЯ?
                        - img "👉" [ref=f3e1268]
                        - text: 9 августа пройдет открытая встреча посвященная подвижным играм, а 23 августа - живописи. Приходите, чтобы поиграть, вживую познакомиться с педагогами и работами учеников, а также задать вопросы.
                        - img "👉" [ref=f3e1269]
                        - text: Весь август мы проводим собеседования с новыми семьями, куда также включена диагностика ребенка в игровой форме. Записаться на встречи и собеседование, а также задать вопросы о "Самоцвете" можно у Ксении или по телефону 8 (9о4) 988 70 39
