                - generic [ref=f1e246] [cursor=pointer]:
                  - generic [ref=f1e248]:
                    - text: Сегодня день рождения
                    - link "Анны Пышинской" [ref=f1e249]:
                      - /url: https://vk.ru/zvezdnosvetnaya
                    - text: ", нашего прекрасного педагога по живописи, проводника в мир красоты!"
                    - img "🍁" [ref=f1e250]
                    - text: "Анна, благодарим, что вы учите ребят не просто смотреть, а видеть - замечать оттенки, линии, настроение момента.. Восхищаемся тем, как вы тонко чувствуете мир, и как щедро делитесь этим чувством: будь то акварельные работы, сезонное оформление столика времен года, или стены 5 класса, расписанные в технике лессировки, которые буквально дышат цветом, столько в них глубины и воздуха!А еще, в каждой куколке, которую создаёте своими руками чувствуется столько тепла и душевности.. Вы - творческая, отзывчивая, мудрая, мы бесконечно ценим, что вы с нами и благодарны за ваш труд, за вдохновение, которое передаете и детям, и взрослым. Что можно пожелать настоящему художнику? Творить! На холсте жизни - свою историю! Пусть палитра дней будет насыщенной, а композиция судьбы - гармоничной и счастливой!"
                    - img "💛" [ref=f1e251]
                    - text: "А здесь, дорогие друзья, хотим поделиться с вами небольшой подборкой постов, где можно увидеть красоту, которую ребята сотворили на уроках живописи под руководством Анны:"
