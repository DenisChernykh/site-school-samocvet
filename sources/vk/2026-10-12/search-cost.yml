                        - text: ПРИГЛАШАЕМ НА ДВУХДНЕВНЫЙ ПРАКТИЧЕСКИЙ СЕМИНАР
                        - img "☀" [ref=f3e1671]
                        - text: 17 и 18 октября, в субботу и воскресенье, в Екатеринбург вновь приезжает Владимир Анатольевич Пегов!Владимир Анатольевич:- 40 лет в педагогике - кандидат педагогических наук, доцент, - профессор кафедры педагогики и психологии СГУС, - директор АНО Центр целостного развития человека, - учитель истории и географии Смоленской вальдорфской школы «Созвучие», - ведущий преподаватель Международного Периодического семинара для вальдорфских учителей.Что будет на семинаре?
                        - img "👉" [ref=f3e1672]
                        - text: "17 октября, в субботу, с 10-00 до 18-00 часовведущая тема - ПОДРОСТКИ (дети от 12 лет). - Кто они, современные подростки? - Как найти правильную позицию в воспитании подростков?- Здоровое пробуждение мужского и женского. Существенные различия в развитии девушек и юношей в этот период. - Современные подростки: между свободой и зависимостями. - Какой опыт может помочь подросткам быть устойчивыми к любым зависимостям?"
                        - img "👉" [ref=f3e1673]
                        - text: "18 октября, воскресенье, с 10-00 до 16-00 часовведущая тема - ОБРАЗОВАНИЕ- Мифы в образовании: безграничные дети и проблемы свободного воспитания; позитивное подкрепление и безоценочный подход; постоянное развитие ребенка. - Корейская дорама \"Истинное образование\"... - Какое образование достойно современных детей? Семинар подойдет родителям, педагогам, работающим с детьми любого возраста, психологам."
                        - img "🍂" [ref=f3e1674]
                        - text: "Адрес проведения семинара: г. Екатеринбург, ул. Новинская, д. 2"
                        - img "🍂" [ref=f3e1675]
                        - text: "Стоимость билетов за оба дня: один человек - 5000р, семейная пара - 6000р.По всем вопросам приобретения билетов"
