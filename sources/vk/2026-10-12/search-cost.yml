                      - generic [ref=f3e1821]:
                        - text: УважаемыеРОДИТЕЛИ и ПЕДАГОГИ!
                        - img "❇️" [ref=f3e1822]
                        - text: Мы рады пригласить вас принять участие в 4-й Международной научно-практической Конференции
                        - img "🔆" [ref=f3e1823]
                        - text: «ДЕТСТВО В СОВРЕМЕННОМ МИРЕ»
                        - img "🔆" [ref=f3e1824]
                        - text: ",которая состоится в Санкт-Петербурге с 1 по 5 июля 2026 года."
                        - img "❇️" [ref=f3e1825]
                        - text: Эта встреча посвящена животрепещущей теме
                        - img "🔆" [ref=f3e1826]
                        - text: «РЕБЕНОК и ВЗРОСЛЫЙ», где будет предложен к рассмотрению весь период детства и юности от рождения до 21 года.
                        - img "❇️" [ref=f3e1827]
                        - text: Конференция представляет собой уникальную платформу для углубленного взгляда на тему взаимоотношений Ребенка и Взрослого.
                        - img "❇️" [ref=f3e1828]
                        - text: "Сегодня современные родители находятся в непростой ситуации: не имея опоры на семейные традиции, которые были основой воспитания в прошлом, они находятся в постоянном поиске педагогических систем и психологических подходов к детям и зачастую все больше теряют ориентиры, в каком направлении двигаться. Все чаще дети становятся для взрослых тиранами или обузой, с ними нет сил справляться самостоятельно.Мы знаем, как важно делиться опытом и поддерживать друг друга в вопросах воспитания."
                        - img "❇️" [ref=f3e1829]
                        - text: Воспитать человека - непростая задача, в которой нет готовых рецептов. Поэтому каждый раз приходится искать заново. Что может быть опорой в этих поисках? Что мы можем сделать для ребенка, не потеряв достоинства настоящего, любящего, искренне помогающего взрослого человека? Эти и многие другие вопросы мы будем обсуждать на лекциях. Постараемся взглянуть на них с точки зрения понимания существа человека в духовной науке Рудольфа Штайнера. Надеемся, что это поможет задуматься и о себе,ведь дети призывают нас направить силы на пробуждение и собственное становление.
                        - img "❇️" [ref=f3e1830]
                        - text: В качестве спикеров выступят опытные педагоги с более 30-летним стажем работы с детьми.
                        - img "❇️" [ref=f3e1831]
                        - text: Вас ожидают не только лекции, а также практические мастер-классы, где можно будет задать все наболевшие вопросы Родителя. Получить поддержку, а также новый взгляд на воспитание, основанный на многолетнем опыте и учениях выдающихся педагогов.
                        - img "❇️" [ref=f3e1832]
                        - text: Конференция может быть интересна воспитателям, учителям и родителям.
                        - img "❇️" [ref=f3e1833]
                        - text: Это уникальный шанс углубить ваши знания и получить ценные открытия.
                        - img "❇️" [ref=f3e1834]
                        - text: Не упустите возможность стать частью этого значимого события!Будем рады видеть вас среди участников!С уважением,Организационная группа
                        - img "✅" [ref=f3e1835]
                        - text: Подробная информация о программе Конференции
                        - link "vk.ru/preschool_seminar" [ref=f3e1836]:
                          - /url: http://vk.ru/preschool_seminar
                        - img "❇️" [ref=f3e1837]
                        - text: Стоимость – 10 000 руб.
                        - img "❇️" [ref=f3e1838]
                        - text: "АДРЕС проведения:Санкт-Петербург, Центр искусства воспитания, проспект Кима, 1. Электронный адрес:"
                        - link "Konferenz-kindheit@yandex.ru" [ref=f3e1839]:
