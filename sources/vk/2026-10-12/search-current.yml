                      - generic [ref=f3e2236] [cursor=pointer]:
                        - generic [ref=f3e2238]:
                          - text: "Приглашаем родителей на очередную встречу Родительского клуба. В этот раз продолжаем говорить об особенностях детей в период от смены зубов до рубикона. \"Особенность преподавания математики в вальдорфской школе \"Рубикон\" . Его проявления.Что нового привносит он в душевную жизнь ребенка Как подача учебного материала может помочь в прохождении ребенком \"рубикона\" \"Будем вместе разбираться, искать ответы! Встреча состоится в воскресенье 26 ноября с 12.30 до 14.30. Место проведения: центр \"Росток\", ул. Фурманова 59, вход со двора (справа от арки за автостоянкой. Стоимость будет зависеть от количества участников, но не превысит 150-200 рублей. О вашем решении придти просьба сообщить: Скоковой Златомире:"
