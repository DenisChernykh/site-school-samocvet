                        - generic [ref=f3e1978]: "Приглашаем родителей на Открытый урок по живописи и арифметики 1 класса вальдорфской школы. Открытый урок состоится 24 (суббота) ноября в 16.00. Расписание: 16.00-16.20 – Вводная часть. Знакомство с вальдорфской педагогикой. 16.20-17.05 – Живопись. Общаемся, рисуем, проживаем. 17.15-18.00 – Арифметика: как, почему именно так она раскрывается детям. Соответствие ФГОС. У вас есть уникальная возможность побывать на месте первоклассника, испытав своего рода, \"вальдорфский тест-драйв\". Все необходимые материалы выдаются. Занятия проводят учителя и родители нашей школы. Адрес проведения: Отто Шмидта, 58, школа «Самоцвет» Стоимость - 250р. Регистрация обязательна. Можно по телефону +7 922 173 44 Златомира Скокова или ЛС."
