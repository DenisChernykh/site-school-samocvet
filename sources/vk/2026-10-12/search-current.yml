                          - text: "10 февраля 10.00 - 12.00 – Живопись. Ведущая Е.Якушева (это отдельное занятие) ОТКРЫТЫЙ УРОК для родителей 12.15 - 14.15 – Рисование форм: симметрия вертикальная, горизонтальная, угловая, асимметричная. Ведущая Е.Якушева 14.15 – 14.40 – Чайная пауза 14.40 - 16.00 – Эвритмия. Ведущая Ю.Малкова 16.00 – 17.15 – Органы чувств – «Равновесие». Как рассказывать образно сказку? (Работа на примере одной сказки - разбор, совместная работа по конкретным движениям, жестам, словам). Ведущая Ю.Малкова"
