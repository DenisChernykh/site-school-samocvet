                        - generic [ref=f3e2171]:
                          - text: "ПРИГЛАШАЕМ на серию «ОТКРЫТЫХ УРОКОВ» родителей будущих первоклассников, всех тех, кто интересуется вальдорфской педагогикой в ее практической реализации, а может быть примеряет на себя роль вальдорфского педагога, а так же самостоятельно обучает или планирует обучать своих детей дома. Выбирая для ребенка вальдорфскую школу, очень важно понимать, почему и как ведется преподавание, почему и как строится учебный план и компилируются учебные программы. От вашего осознанного отношения к процессу обучения вашего ребенка, вашего доверия к его учителям и собственного активного участия в жизни школы во многом зависит, насколько вдохновенно будет учиться ребенок. На ОТКРЫТОМ УРОКЕ на примере «рисование форм» вы сможете: • узнать и пережить весь ход главного урока • понять, на что направлена работа классного учителя • какие открытия может сделать для себя ребенок на уроке • как можно помочь ребенку: усилить то, что в нем ослаблено. Мы пойдем от практики и завершим теорией – как подводящей итог, и оформляющей полученное понимание. ПЕРВОЕ ЗАНЯТИЕ состоится 20 ЯНВАРЯ по адресу: Фурманова, 59. Все подробности во вложении. Для регистрации просьба написать в личку Скоковой Златомире"
