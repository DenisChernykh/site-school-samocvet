                    - text: Традиционный осенний поход - праздник Мужества состоялся!
                    - img "🔥" [ref=f7e681]
                    - text: Субботний денек выдался солнечным, а испытания на смелость начались еще до того как мы добрались до скал Гронского - детям нужно было по бревнам перебраться через затопленные участки земли. Эта задачка оказалась им по плечу и даже вызвала восторг!На месте распределились по классам, младшие - слушали сказку и играли с учителями, четвероклассники составляли карту местности, а старшим досталось самое ответственное.Мальчики заготовили дрова, натаскали брёвен, разожгли костёр и следили за ним вместе с папами. Девочки готовили и пели песни с мамами и
                    - link "Татьяной Георгиевной" [ref=f7e682]:
                      - /url: https://vk.ru/tansur
                    - text: .Потом ребят ждали испытания от пап, и это, пожалуй, были самые лучшие испытания за всю нашу историю - ребята проходили их очень включённо и старательно.. Поддерживали друг друга, думали, проявляли командные качества.Как награда - напиток храбрости! Кстати, он был очень насыщенным и вкусным - девочки жали кислые ягоды своими руками, а мамы не пожадничали пряных согревающих специй! Благодарим каждого за организацию и участие
                    - img "🙏" [ref=f7e683]
