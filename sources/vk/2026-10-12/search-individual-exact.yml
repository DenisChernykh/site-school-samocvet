                  - generic [ref=f3e2536]:
                    - generic [ref=f3e2539] [cursor=pointer]:
                      - generic [ref=f3e2541]:
                        - text: В воскресенье, 5 АПРЕЛЯ, приглашаем на
                        - img "🕯" [ref=f3e2542]
                        - text: ПИСАНКУ
                        - img "🥚" [ref=f3e2543]
                        - img "☀" [ref=f3e2544]
                        - text: В нашем пространстве живет очень много интересных, творческих людей. Например,
                        - link "Татьяна Сурь" [ref=f3e2545]:
                          - /url: /id50359732
                        - text: ", педагог по музыке. На протяжении всего года она проводит танцевально-певческие встречи для взрослых и индивидуальные занятия для детей, а летом, совместно с другими волшебниками, организует семейные выезды -"
                        - link "Творческие Смены" [ref=f3e2546]:
                          - /url: https://vk.ru/tvorcheskiesmeny
                        - img "🤗" [ref=f3e2547]
                        - text: . 5 апреля в процессе живого творческого дела, расписывая Писанку, можно будет познакомиться с командой заезда 2026. А также с нашим добрым светлым пространством (если по каким-то причинам вы не смогли попасть на День открытых дверей).
                        - img "☀" [ref=f3e2548]
                        - text: Войдем в пространство через игровые хороводы. Чтобы услышаться, увидеться, раздышаться!
                        - img "🔥" [ref=f3e2549]
                        - text: Писанка - дело настоящее и опасное при неосмотрительности. Поэтому встреча семейная, дети приходят только вместе со своими родителями!
                        - img "✍" [ref=f3e2550]
                        - text: Нужна предварительная запись и оплата, чтобы мы сформировали достаточный круг пишущих за одним столом.
                        - img "☝" [ref=f3e2551]
                        - text: "К встрече необходимо подготовиться. С собой принести:✓парафиновую свечу, ✓восковую свечу, ✓сырые белые яйца (1,2 сорт, без трещин, и, с учётом нечаянных падений на пол, штук 5-6 на человека). С малышами от 4лет делаем крапанки (см.на фото): дети видят превращение цвета и формируют восковой свечой цветные пятна на яйце. Некоторые очень увлекаются (это намёк про запас яиц).У детей постарше, от 6-7лет, кто возьмёт в руки писачок/кистку, дело пойдет медленнее. Это более трудоёмкий процесс. Поддержка взрослых нужна будет и тем, и другим: моральная (когда всё идёт не так!) и физическая (оберегать, обеспечивая технику безопасности). С детьми помладше, кто быстрее потеряет интерес к кропотливой работе, наша Оля, - мастер игры, - пообщается в другой комнате, пока старшие продолжают писать.ДАТА: 5 апреля ВРЕМЯ: с 10.30-12.30 или с 17.00-19.00 (ещё обсуждаем, напишите своё мнение"
                        - img "🙏" [ref=f3e2552]
                        - text: ") ОПЛАТА: с каждого пишущего 500р, в многодетных семьях по 400р. Запись, вопросы по подготовке и оплате"
                        - link "Татьяне Сурь" [ref=f3e2553]:
                          - /url: /id50359732
                        - text: "PS: Также пройдет писанка для взрослых, уже 29 марта, но в г. Берёзовском. Если интересно - пишите!"
