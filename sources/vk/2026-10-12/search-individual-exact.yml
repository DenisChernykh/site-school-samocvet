                        - text: Педагог первого класса -
                        - link "Юнусова Анна Борисовна" [ref=f3e2389]:
                          - /url: https://vk.ru/anasbka
                        - text: "- мама двоих детей, заботливая жена, путешественница, педагог"
                        - img "☀" [ref=f3e2390]
                        - text: "\"Филолог по образованию и, воспитанная в семье педагогов, я глубоко погружена в мир образования практически с детства. Во время учебы в университете поняла насколько несовершенна традиционная система воспитания детей — многие подходы оказались негуманными и неэффективными. Поэтому после окончания вуза решила начать свою карьеру с индивидуальной работы: работала няней, параллельно занимаясь репетиторством. Мне важно было сделать каждое занятие интересным и увлекательным, найти индивидуальный подход к конкретному ребёнку. Но настоящая страсть к педагогике вернулась, когда появились собственные дети. Несмотря на профессиональные знания, задача воспитания собственных малышей оказалась гораздо сложнее, чем ожидалось\".P.S. О том, как Анна познакомилась с вальдорфской педагогикой и как она видит свой будущий первый класс - расскажем и покажем в небольшом видеоинтервью, которое опубликуем совсем скоро"
