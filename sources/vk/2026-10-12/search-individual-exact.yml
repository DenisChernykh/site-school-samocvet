                        - text: прозвучать в единстве,
                        - img "☀" [ref=f3e2465]
                        - text: просто быть открытым, и началось волшебство!Мы делали различные упражнения, используя подручные материалы - вязаные мячики, шерстяную веревочку .. и, конечно, свой голос! По-разному экспериментировали с ритмами, звуками и осознали ценность паузы. Например, одним из заданий было - пропеть свое имя - МаааааШааааааа - на одной ноте, не уходя ни вверх ни вниз, без украшений, масок, "пряток". Это было очень трепетно и уязвимо - ты вот такой какой есть. Прозвучать самому по-настоящему и подарить это звучание другому, ощутив шлейф послезвучия в пространстве, который может рассказать о тебе еще больше, чем сам звук..
                        - img "❤" [ref=f3e2466]
                        - text: Музыка - средство выражения души. Чтобы говорить на языке музыки нужна определенная смелость - вынырнуть из скорлупы обусловленности и быть душой, проявить себя ей и услышать души других.. Музыка соединяет в себе небесное и земное, учит опираться на невидимое - на свет, на внутренний голос. Способствует развитию глубинной связи с самим собой и укрепляет ее, ту, которая позволяет уверенно идти по жизни, и которую мы так хотим видеть у своих детей.. А начинается все с, казалось бы, простых вещей. "В первом классе мы только летаем" - рассказала педагог
                        - link "Татьяна Сурь" [ref=f3e2467]:
                          - /url: /away.php?to=https%3A%2F%2Fvk.com%2Fid50359732&utf=1
                        - text: ", \"внутренние органы и тело достраиваются, мы еще не переживаем в музыке сильные чувства\". Основа занятий - песни в унисон, простые мелодии на пентатонических флейтах, игры со звуком и тембром.С 3-го класса дети получают диатонические, т.е. до-мажорные флейты, разучивают и поют песни различных народов, осваивают пение 2-хголосым каноном и потихоньку - нотную грамоту.Чем дальше, тем интереснее - появляются ансамбль, хор, история и слушание музыки, биографии выдающихся музыкантов. Постепенно, в согласии со своим возрастом и темпераментом, с развитием мастерства, ребенок приходит к творчеству, сочинительству и спонтанной импровизации - свободе выражения души.Татьяна рассказала и про разные музыкальные инструменты. И про настроение разных интервалов. Считается, что примерно до девяти лет жизни ребёнок преимущественно «живёт» в переживании квинты. По мере взросления, примерно к подростковому возрасту, у человека начинает доминировать «переживание терции». Этот интервал связан с более сложным, дифференцированным восприятием мира, с развитием абстрактного мышления и эмоциональной глубины..К сожалению, в рамках постах не объять необъятное и мы продолжаем приглашать вас на"
                        - link "живые встречи" [ref=f3e2468]:
                          - /url: /away.php?to=https%3A%2F%2Fvk.com%2Fwall-156951422_3603&utf=1
                        - text: "- погружения, где можно почувствовать то, что за словами, приобрести свой уникальный опыт и услышать информацию из живых уст. Следующая состоится 5 июля с 14.30 до 16.00 и будет посвящена рукоделию, подробный анонс - в ближайшем посте"
                        - img "❤" [ref=f3e2469]
                        - text: "P/S: В этой"
                        - link "статье" [ref=f3e2470]:
                          - /url: /away.php?to=https%3A%2F%2Fvk.com%2Fwall-59008461_11564%3Fysclid%3Dmqyp9zsjcb246290497&utf=1
                        - text: можно прочитать подробнее про преподавание музыки по классам. А
                        - link "здесь" [ref=f3e2471]:
                          - /url: /away.php?to=https%3A%2F%2Fvkvideo.ru%2Fvideo-173211610_456239282%3Ft%3D23s&utf=1
                        - text: послушать о том, как проходят уроки музыки в старшем звене вальдорфской школы.
