              - generic [ref=f11e167]:
                - link "ДИНА РАМАЗАНОВНА ГРЕБНЕВА" [ref=f11e168] [cursor=pointer]:
                  - /url: https://vk.ru/happy_grebneva
                - text: (классный учитель 5 класса) Я жена и мама двоих рыжих мальчишек. До рождения детей я успела сделать карьеру в сфере управления персоналом. После - вела социальные проекты и организовывала мероприятия для мам, вела свой небольшой и уютный бизнес. В 2018 году на горизонте замаячила школа для старшего сына, и я занялась поиском образовательной методики. Так я попала на фестиваль разумного образования, где наблюдала всю палитру педагогических красок от классических до альтернативных, авторских . Но мои дети привели меня в вальдорфскую педагогику. Вальдофрская педагогика – это была не просто ВСТРЕЧА, это было УЗНАВАНИЕ. Будто вся жизнь до этого была поиском, подготовкой, а теперь поиски окончены, я дома. Я закрыла бизнес, отказалась от всех МЕГА грандиозных проектов и пошла учиться на вальдорфского педагога... Тогда же я на общественных началах стала проводить у детей в школах мастер-классы, во дворе подвижные игры. А впоследствии получила опыт преподавания в вальдорфской инициативе и поняла, что, решившись в 40 лет изменить свою жизнь, я нисколько не ошиблась, что мне есть что дать детям, а моя любовь передается им.
