                - link "ДАРЬЯ ЛЕОНИДОВНА ЧЕСНАКОВА" [ref=f11e116] [cursor=pointer]:
                  - /url: https://vk.ru/id9114279
                - text: "(классный учитель 2 класса) По природе, я творческий человек. В детские годы закончила музыкальную школу по классу фортепиано. Получила высшее образование по специальности Промышленный дизайн. Успешно работала по профессии. Но, с появлением своих троих детей, приоритеты поменялись. Несколько их первых лет жизни удавалось совмещать работу и домашнее творческое развитие. Мы много мастерили своими руками, используя различные материалы: рисовали, лепили, вырезали, шили, делали поделки, показывали спектакли, напевали песенки, играли на первых музыкальных инструментах. О Вальдорфской педагогике я узнала через блог Елены Гринталь. Методика оказалась очень созвучна с тем, что мне близко, поэтому органично вплелась в нашу творческую жизнь, обогатив её проживание эпохами. Каждое время года вносило свои акценты в сюжеты поделок, игр и любых повседневных дел. То, что покорило моё сердце – это природосообразность всех процессов, их естественное перетекание из одного в другое, ритмичность этой смены дел и бережное отношение к природе, существу самого ребёнка, индивидуальный подход к его темпераменту, характеру. Это живая педагогика! Каждый учебный процесс на уроке мягко открывает в ребёнке его творческую искорку, учит находиться в потоке урока, из мира образов плавно переводит его мышление в живой мир природных взаимосвязей. Через ритмические движения, стихотворения, рукоделие, живопись, поучительную сказку, открываются ему новые смыслы. Взаимосвязанность всех уроков формирует в нём целостную картину мира – это, пожалуй, самое главное. Оформление своих работ – это отдельная тема: всё постараться сделать красиво, привить любовь детей к гармоничному виду своей рабочей тетради. А, через такое отношение к малому, дать понимание важности внимательного, бережного, созидательного отношения ко всему в этой жизни. В первом классе мы будем постигать этот базовый навык – процесс обучения. В Вальдорфской школе он происходит эпохами: эпоха форм, эпоха букв, эпоха цифр, эпоха окружающего мира. Творческий подход будет проходить красной нитью по всем дисциплинам: главный урок, живопись, рукоделие, игру на флейте, эвритмию. В каждой их них мы постараемся познавать суть любого явления, будь то линия, цвет, форма, звук, число, буква, слово. Будем учиться доводить начатое дело до конца, погружаться в этот процесс. Развитие мышления, воли, внимания, концентрации, аккуратности, расширение понимания этого мира, поддержание природного импульса к познанию в каждом ребёнке – это только малая часть задач, которые нам предстоит прожить совместно. Вальдорфский учитель – всегда сам ученик. Я также продолжаю обучение Вальдорфской педагогике у лучших учителей нашего движения. Я ещё в начале пути, но это очень вдохновляющий для меня процесс! Последние два года я обучаю группу детей основам изобразительного искусства, этот опыт также поможет в выстраивании учебного процесса в классе. Важные задачи стоят впереди у первого класса. И я готова начать этот путь вместе с нашими детьми. Буду очень рада всем семьям, решившим идти вместе дорогою прямой! Именно от этой связи: Ребёнок-Учитель-Родитель, будет зависеть, к какому результату нам удастся прийти в обучении наших детей. В добрый путь, осенью наш корабль отправляется в плавание, на встречу к знаниям! Благодарю за внимание. Ваш учитель первого класса, Дарья Леонидовна Чеснакова."
