                - link "ИРИНА ВИКТОРОВНА ГРИГОРЬЕВА" [ref=f11e142] [cursor=pointer]:
                  - /url: https://vk.ru/irveng
                - text: "(классный учитель 4 класса) Мечта быть учителем родилась во мне ещё в 6 лет, в детском саду. К старшим классам школы она забылась, но когда пришло время поступать в ВУЗ, я пошла в педагогический институт - в начале на факультет информатики, а потом перешла на начальные классы. В этот период я испытала большое разочарование в системе образования. В учебниках было написано одно, педагоги говорили другое, а на практике выходило третье. К вальдорфской педагогике я пришла уже тогда, когда у меня самой появился ребёнок. Места в муниципальном садике нам не хватило, и мы начали искать варианты общения. Первое знакомство для нас состоялось в садике \" Подсолнушки \" (ныне \" Гнёздышко \", где я проработала какое-то время помощником воспитателя. По семейным обстоятельствам из садика пришлось уйти. Какое-то время работала няней на дому. Заново вальдорфскую педагогику для меня открыла Ирина Толстых - мы дружили семьями и наши дети много играли вместе. Затем Ирина поехала учиться на садовницу (воспитателя) в Казань. Её рассказы меня вдохновляли и рождали множество вопросов. Я спорила, многое было необычным и непривычным, однако, постепенно пришла к абсолютной разумности вальдорфской педагогики, её соответствию истинным потребностям ребёнка, и начала свое обучение. В педагогике было всё, что нужно для здорового развития Человека. И, главное, я видела ее в действии - как целительно она влияла на моего ребёнка. Эта педагогика действительно помогает стать Человеком - и ребёнку, и учителю. Она способствует гармоничному развитию - как телесному, так и душевному. Учит мыслить и грамотно излагать свои мысли. Воспитывает свободную личность, уважающую при этом других людей, являющуюся частью коллектива. Учит бережно и с некоторым трепетом относиться к природе и ко всему, что нас окружает. Мне нравится творческий подход к каждому предмету. Здесь красота и живое начало во всём: и в числах, и в буквах, и в экспериментах на уроке физики... Радостно видеть живые, заинтересованные детские лица. Нравится готовиться к урокам - обучая детей, постоянно учусь чему-то новому сама. А ещё работа учителем - это постоянная работа над собой, этакий тренинг личностного и духовного роста нон-стоп. Здорово, что \" Самоцвет \" - это именно сообщество семей - только имея постоянный контакт с родителями ребёнка, можно говорить о гармоничном развитии. Ребёнка не просто отдают в школу, здесь в образовании и воспитании участвует вся семья. Дети с радостью читают первую книгу, написанную любящей маминой рукой, готовят для родителей спектакли, сидят за столами, сделанными вместе с папами. Здесь школа и семья не противопоставляются друг другу, а представляют собой единое целое."
