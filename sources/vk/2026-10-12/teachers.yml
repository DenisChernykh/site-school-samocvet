            - generic [ref=f11e218]:
              - generic [ref=f11e219]: "ЕЛЕНА СТАНИСЛАВОВНА ЯКУШЕВА (директор, наставник и куратор педагогов, ведущая дополнительных занятий по живописи и искусству) В вальдорфскую педагогику меня привела моя дочь, когда ей исполнилось семь лет и встал вопрос выбора школы. Мы с мужем для себя решили, что это будет не государственная школа после того, как сводили дочку на собеседование в мою альма-матер, одну из лучших школ города, лицей №130. Наблюдая, как общаются с моей «тургеневской» девочкой в процессе собеседования, я поняла, что государственная мясорубка ее сломает. И мы стали искать. Таких ищущих в нашем микрорайоне собралось 12 семей, и 1 сентября 1990 года мы привели своих детей в 1 класс Семейной школы Николина, где нас благополучно \"кинули\" - наш класс оказался без учителя. Пришлось закрывать своей грудью амбразуру и искать учителей. Тут я услышала по радио об ознакомительном семинаре Московского открытого университета, где планировалось представить инновационные системы мировой педагогической практики. Из всех представленных школ именно вальдорфская вызвала живой отклик в моей душе. То, что я тогда услышала, уже жило во мне и гармонично ложилось на подготовленную жизненным опытом почву. Так началось мое путешествие в удивительный и захватывающе интересный мир вальдорфской педагогики. Моими учителями были Эрнст Шуберт, Ангелика Колли, Даниэль Вирц, господин Краузе, Петер Пютц, Астрид Штегман – Шмидт, Петер Бюхи и, конечно, незабвенный Юрген Теберат, наш дорогой Юрий Иванович, как по-русски все мы его величали. С каждым днем моего обучения на классного учителя вальдорфской школы я все больше убеждалась в верности выбора педагогической системы для своих детей. С каждым днем я ощущала все больше и больше недостаток образования, которое я получила не только в школе, но и в ВУЗе. Мне так хотелось, чтобы мои дети имели то, что дают в вальдорфских школах: и радость собственных открытий, и знания, тесно связанные с жизнью. Я полюбила историю, которую в школе тихо ненавидела, биология открылась в моих глазах совсем с другой стороны. Я начала осознавать себя сопричастной тому, что вокруг меня происходит. А курс истории искусств, а живопись и пластицирование… Я изучала эти предметы в течение пяти лет учебы в институте, но за это время не открыла для себя и десятой доли того, что подарили мне годы учебы на семинаре. Моя дочь проучилась в вальдорфской школе только 6 лет. Это были, по ее словам, лучшие годы школьной жизни. В третьем классе мы измеряли площадь классной комнаты аршинами, пядями, саженями и приходили к необходимости единой метрической системы. Изучая глаголы, выезжали в лес слушать тишину. В четвертом классе, прорабатывая план школьного здания и школьного двора, оставались в школе с ночевкой, чтобы провожать солнце на закате и встречать рассвет, и таким образом найти ориентацию нашего плана по сторонам света. А какой спектакль по мотивам былины и оперы Мусоргского «Садко» поставил наш класс в конце года: потрясающе колоритный морской царь в исполнении Кости Виткина и обладающий волшебным голосом Садко Вася Шилков.. Да, много всего интересного произошло за эти золотые шесть лет. Вы спросите, а что же было дальше? А дальше так случилось, что вальдорфской школы не стало. Кто-то из детей остался доучиваться. Мы же с мужем забрали своих детей и перевели их в языковую школу. Переход для них прошел очень легко. Вальдорфская школа научила мою дочку учиться. И когда у всего класса наблюдалось падение успеваемости, характерное для 7 класса, моя Таня продолжала учиться ровно с двумя-тремя четверками в четвертях. Учителя-предметники на родительских собраниях ставили в пример тетради моей дочери, а учительница русского и литературы не переставала восхищаться ее сочинениями. И вот я снова в рядах педагогов, теперь вальдорфской инициативы «САМОЦВЕТ». Сейчас нашему сообществу уже 7 лет, и мы активно растем и развиваемся. Приводите к нам своих детей. Дети в нашей школе учатся с удовольствием и интересом!"
