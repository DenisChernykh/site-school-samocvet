                - text: "(классный учитель 6 класса) Когда моей дочери настала пора идти в школу передо мной как и перед другими родителями стоял вопрос выбора школы.. Возможно, мне было немного проще определиться.. Ведь я к тому времени исходя из опыта работы садовницей, так называют воспитателей в вальдорфском детском саду , знала, что вальдорфская педагогика - это как раз то, что нужно моей дочке, и я желала ей учиться именно в вальдорфской школе. Но не всё так просто.. В то время в Екатеринбурге еще не было вальдорфской школы, существовала только семейная инициатива на Уралмаше для детей 9-10 лет. А некоторые семьи, чьим детям пора было идти в школу, даже переезжали в другие города ради того, чтобы их дети могли учиться именно в вальдорфской школе. И вот весной 2018 года в вальдорфском детском саду состоялся большой выпуск. Несколько семей вместе с педагогами основали семейную вальдорфскую инициативу, наше сообщество «Самоцвет». Для нас было очень важно, чтобы: - с детьми работал высоко организованный, чуткий, внимательный, творческий, любящий детей педагог - осуществлялся индивидуальный подход, исходя из потребностей и возможностей ребёнка и задач, стоящих перед ним, и ценность каждой личности определялась не наличием хороших оценок... - ребенок имел возможность творить и мыслить не по шаблону - чтобы ребенок получал не только фундаментальные знания, но и развивался в области искусства, научился разговорным иностранным языкам - дисциплина основывалась бы не на окрике и страхе, а на авторитете учителя, уважении к нему и благодаря его личному примеру - обучение максимально связывалось бы с жизнью, и ребенок учился с радостью - чтобы школа для ребенка стала вторым домом, а одноклассники настоящими друзьями - чтобы учителя взаимодействовали с родителями в вопросах обучения и воспитания детей Именно в таком духе уже несколько лет работает наша инициатива «Самоцвет». Приходите к нам! Будем рады новым ученикам, воспитанникам, новым семьям!"
