            - generic [ref=f11e88]:
              - generic [ref=f11e89]:
                - link "АННА БОРИСОВНА ЮНУСОВА" [ref=f11e90] [cursor=pointer]:
                  - /url: https://vk.ru/anasbka
                - text: "(классный учитель 1 класса)Мама двоих детей, заботливая жена, путешественница, педагог.\"Филолог по образованию и, воспитанная в семье педагогов, я глубоко погружена в мир образования практически с детства. Во время учебы в университете поняла насколько несовершенна традиционная система воспитания детей — многие подходы оказались негуманными и неэффективными. Поэтому после окончания вуза решила начать свою карьеру с индивидуальной работы: работала няней, параллельно занимаясь репетиторством. Мне важно было сделать каждое занятие интересным и увлекательным, найти индивидуальный подход к конкретному ребёнку.Но настоящая страсть к педагогике вернулась, когда появились собственные дети. Несмотря на профессиональные знания, задача воспитания собственных малышей оказалась гораздо сложнее, чем ожидалось\".Анна Борисовна пришла в вальдорфскую педагогику, следуя за своим внутренним интересом. Педагогический бэкграунд, а затем собственный поиск ответов на вопросы о воспитании, развитии и обучении, с появлением своих детей, все более живой и тщательный, подводили ее все ближе к вальдорфу.Казалось - старые методы не работают, а новых еще нет. Нужно что-то еще. Анна даже думала создать свою, какую-то новую педагогику. Но, известная аксиома: тот, кто ищет - находит, всегда. \"Случайное\" объявление в группе вк, \"случайный\" рассказ соседки - и вот Анна уже пробует себя в роли садовницы (воспитателя вальдорфского детского сада), затем - помощницы в организации вальдорфского дошкольного педагогического семинара. И.. вслед с сыном приходит в вальдорфскую школу - учиться.\" Школа - это не только академические знания, это не только социализация, а .. признание человека, его личной, индивидуальной судьбы. Учителю важно увидеть, что у ребенка - свои возможности, свой интеллект - его не надо подгонять, подстраивать, а помогать идти в его темпе. И очень сильно - ЛЮБИТЬ\",- так сейчас говорит Анна. Мудрость педагогики соединилась с чем-то глубоко значимым в ее сердце, и в этом году она стала уже классным руководителем первого класса. Желаем еще большей глубины, успехов ученикам, неиссякаемого вдохновения и радости продолжать этот путь🧡"
