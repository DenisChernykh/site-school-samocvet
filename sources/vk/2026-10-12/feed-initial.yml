                    - img "❤" [ref=f1e326]
                    - text: "Дарья , от всей души благодарим за то, что каждый день ты даришь детям знания, тепло и драгоценное внимание. Особенно ценим твою ответственность и удивительную организованность: с тобой в классе всегда уютно, всё понятно, любой день складывается в красивую, продуманную историю - и ребята чувствуют себя спокойно и уверенно. Отдельное восхищение — твоим талантом художника! То, как ты оформляешь школьную доску, украшаешь класс и превращаешь обычные темы в живые образы - настоящее искусство, которое останется в памяти ребят надолго.Желаем неиссякаемого вдохновения, сил и радости от каждого урока. Пусть всё задуманное легко сбывается, а ученики радуют своими открытиями и улыбками!"
                    - img "💐" [ref=f1e327]
                    - text: "А с вами, дорогие читатели, хотели бы поделиться тем, что Дарья Леонидовна постоянно учится, чем бесконечно вдохновляет: почти закончен вальдорфский дошкольный семинар, и уже пройдена первая сессия педагогического семинара в Санкт - Петербурге. Столько труда и любви к своему делу - искренне гордимся, что именно Дарья ведёт наших второклассников! Если хотите, чтобы ваш ребенок стал учеником Дарьи - пишите"
