                    - text: 16 и 17 октября в нашем пространстве состоится премьера спектакля " По стрелам вверх " от театра " Добрые люди "
                    - img "🍁" [ref=f1e485]
                    - text: Основатель и режиссер -
                    - link "Никита" [ref=f1e486]:
                      - /url: https://vk.ru/nikita.vinogradov.nitya
                    - text: Виноградов, папа пятерых детей, трое из которых учатся в нашей семейной школе. Вместе с супругой
                    - link "Анной" [ref=f1e487]:
                      - /url: https://vk.ru/anna_purna
                    - text: в этот раз они также будут актёрами
                    - img "⚡" [ref=f1e488]
                    - text: "Первой работой театра стала мистическая притча \" Точка невозврата \". \" По стрелам вверх \" - второй спектакль, как говорит Никита, его можно охарактеризовать как \" терапевтическую комедию с элементами художественного тренинга \".Шесть абсолютно непохожих людей случайно оказываются в замкнутом пространстве. Что их связывает? Почему они встретились? А главное - кто этот загадочный Седьмой, человек - вопрос, человек - тайна, у которого есть \" ключи от всех дверей \"?\" Это не просто спектакль, это - зеркало. Вы узнаете себя в каждом герое, посмеетесь над своими страхами и, возможно, найдете ответы на свои вопросы, которые давно прятали в дальний ящик. Мы обещаем: будет смешно, глубоко и по-настоящему терапевтично.А еще мы хотим дружить со зрителем вдолгую - нам очень важна любая обратная связь, поэтому готовим доверительное пространство для беседы после спектакля - с горячим чаем и вкусностями \".Для показа премьеры ребята специально выбрали два дня:"
