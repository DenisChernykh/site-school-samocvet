              - generic [ref=f4e62]: "ЕСТЬ ЛИ В ШКОЛЕ РЕЛИГИОЗНАЯ НАПРАВЛЕННОСТЬ? С ЧЕМ ЭТО СВЯЗАНО? Да, мы действительно опираемся в ритме года на христианские праздники. День св. Михаила (Георгия) – праздник Мужества, День св. Мартина - праздник Милосердия, Рождество и Пасха. Но делаем акцент не на догмы и религиозные ритуалы, а на само содержание, смысл, что стоят ЗА названием. Переживание событий, связанных с тем или иным праздником, воспитывают определенные внутренние качества в ребенке: чувство благодарности, благоговения к человеку как к высшему творению природы, ответственность за то, что его окружает, доброту. Без этого мы воспитаем черствого, эгоистичного, хамовитого человека. А право выбора конфессии всегда остается за родителями."
