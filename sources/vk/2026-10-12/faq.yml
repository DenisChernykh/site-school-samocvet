            - generic [ref=f4e156]:
              - generic [ref=f4e157]: "Вопрос: Очень смущает, что нет никаких критериев, по которым можно было бы оценить знания детей. На мой взгляд, дети явно отстают в общеобразовательном плане от учеников школ со стандартной программой. Если вдруг придется ребенка переводить обратно в обычную школу, могут начаться большие проблемы с уровнем знаний. Ответ: В нашей учебной программе тщательно соблюдается баланс между получением практических навыков, занятиями различными видами искусств и изучением фундаментальных наук. А главное - важна не успеваемость и ее проверка (без проведения контрольных и тестовых заданий), но развитие творческих способностей, компетентность в деле, чувство социальной ответственности. Полученная детьми информация должна быть применена на практике, только тогда она станет Знанием, которое можно применить в Жизнь. И все же наша школа не работает вслепую, мы опираемся на образовательные программы, разработанные благодаря совместной работе учителей вальдорфских школ России из разных городов, зарубежных специалистов и российских экспертов образования. В соответствии с требованиями государственных образовательных стандартов. И - при максимально возможном сохранении специфики методики и дидактики вальдорфской школы. Все эти образовательные программы одобрены Министерством образования Рф."
