            - generic [ref=f4e137]:
              - generic [ref=f4e138]: "Вопрос: Вальдорфская школа. Она для тех, кто делает акцент на эстетическом образовании? Ответ: Важнейшая задача вальдорфской педагогики - воспитание целостного человека. И развитием в ребенке художественного чувства мы на всю жизнь пробуждаем у него интерес ко всему миру. Художественным понизан сам метод преподавания всех предметов. И поверьте, знания, полученные ребенком благодаря возникающему интересу, усваиваются гораздо лучше, чем те, что получают дети, заучивая написанное в учебнике."
