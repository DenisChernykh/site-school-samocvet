              - generic [ref=f4e81]: НЕУЖЕЛИ ТАК ОПРАВДАНА "ТЕПЛИЧНАЯ" АТМСОФЕРА, КОГДА НИЧЕГО НЕ ЗАДАЕТСЯ И НЕ СПРАШИВАЕТСЯ? КАК ТОГДА РАЗВИВАЕТС ЧУВСТВО ОТВЕТСТВЕННОТИ И ДИСЦИПЛИНЫ? Вспомним примеры из истории. Благородство души, ответственность, самодисциплина, сила духа, способность противостоять невзгодам, - качества, которые явили всему миру жены декабристов, были взращены воспитанием как раз в «тепличных условиях». Человек, не познавший прекрасного (а преподавание всех предметов в вальдорфской школе первые 7 лет школьной жизни ведется под девизом «мир красив») не может противостоять внешнему насилию и отвратительным проявлениям жизненных ситуаций. А задания на дом детям даются, но они носят творческий и исследовательский характер.
