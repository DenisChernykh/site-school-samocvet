            - generic [ref=f4e194]:
              - generic [ref=f4e195]: "Вопрос: Говорят, что не все учителя вальдорфской школы имеют педагогическое образование? Почему? Ответ: У педагога, проработавшего некоторое время в традиционной школе наступает профессиональная деформация. И, напротив, у технически образованных специалистов обнаруживается высочайший талант к педагогике. Важны человеческие качества, в первую очередь. Педагог в нашей школе – не просто специалист, применяющий на практике вальдорфскую педагогическую систему. Это глубоко интеллигентный, нравственно ориентированный человек с гумманистической жизненной философией. Целостная человеческая личность. Все наши педагоги стремятся к этому и постоянно работают над собой. А недостаток педагогического образования мы компенсируем на обучающих трехгодичных курсах для вальдорфских учителей, на которых обучаются все наши педагоги. (ред.)"
