              - generic [ref=f4e100]: КАК ОБСТОЯТ ДЕЛА С ДИСЦИПЛИНОЙ В ВАШЕЙ ШКОЛЕ? Если дети весь урок сидят по струнке - это не дисциплина. Дисциплина начинается с Учителя. Он приходит в школу за 30 минут до начала уроков, и таким образом показывают пример организованности своим ученикам. Дисциплина – не результат окрика или страха, не внутреннее напряжение от угроз, а следствие большой работы педагога по взращиванию внутренней самоорганизации учеников. Проблемы с дисциплиной уходят, если детям на уроке интересно. Если Педагог вдохновляет. Тогда и ученик внимательно слушает учителя и выполняет все его задания...
