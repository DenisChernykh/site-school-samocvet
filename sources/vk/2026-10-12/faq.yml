            - generic [ref=f4e175]:
              - generic [ref=f4e176]: "Вопрос: И все же, согласитесь, художественное развитие – не самое главное в образовании ребенка. В современном мире необходимы академические знания. А в вашей школе к этой стороне образования подход как второстепенной. Ответ: В нашей школе дети учатся не для того, чтобы написать контрольную или сдать ОГЭ с ЕГЭ. Нам важно ненасильственно, подобно тому, как это делают в школе Сухомлинского, вызвать в ребенке живой интерес к изучаемой области знаний, возбудить в нем пытливый наблюдающий взгляд. Тогда в старших классах ребенок будет способен проводить исследования в рамках курсовых работ, которым порой смогут позавидовать студенты ВУЗов. Тогда во взрослую жизнь выйдут молодые люди сильные духом, способные решать трудные жизненные задачи. И кто-то из них, возможно, станет Нобелевским лауреатом как Томас Кристиан Зюдхоф в области физиологии и медицины. Можно назвать еще много других успешных выпускников школ, чьи имена гремят на весь мир: Йенс Столтенберг (занимает высшую руководящую должность в НАТО), писатель, автор знаменитой «Бесконечной истории» Михаель Энде, обладательница «Оскара» Сандра Баллок, и не менее знаменитая Дженнифер Энистон, и многие другие."
