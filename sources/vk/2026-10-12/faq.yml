                - /url: /samocvet_me
            - generic [ref=f4e213]:
              - generic [ref=f4e214]: "Вопрос: Всё хорошее в вальдорфской школе держится на 80% за счет родителей, их энтузиазма, заинтересованности, участия в школьной жизни. Хорошо, если у родителей есть много свободного времени для родительских курсов, семинаров, праздников, ярмарок, походов, рукоделия. А если нет? Ответ: На самом деле школа держится не только на энтузиазме родителей. Они поддерживают те направления, которые задает учитель, и помогают ему в организации внешкольных мероприятий. Большой бедой нашего времени стало то, что родители зачастую не имеют времени на своих детей. К сожалению, в таких случаях они рассматривают школу как место, куда можно сдать ребенка для воспитания и образования. А ведь ребенок нуждается в своих родителях, в совместном с ними творчестве. Он не просто так приходит в семью... а чтобы показать своим родителям, что те должны изменить в себе, чтобы вырастить ребенка достойным человеком. Осознанное родительство – это большая работа над самим собой, постоянный поиск путей понимания ребенка на каждом этапе его развития. Поэтому так важно участие родителей в жизни школы и посещение Родительской академии. Миссия вальдорфской школы - повышать общую осознанность. Эти высокие цели воспитания изначально привлекают не пассивных, ведомых, а инициативных, глубоко думающих и чувствующих родителей. Возможно, если Вы не готовы участвовать в общем процессе - нам пока не по пути. но если есть даже небольшое желание - двигаться в сторону осознанности, совместные пути решения и взаимодействия всегда найдутся."
