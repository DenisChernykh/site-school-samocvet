            - generic [ref=f4e118]:
              - generic [ref=f4e119]: "Вопрос: В школе - дети из разных социальных слоев. Проблемы в семье ребенка накладывают отпечаток на поведение ребенка в коллективе. Как результат - ссоры, травмы, жестокость. Неужели дети в вальдорфской школе не такие же, как и других школах, и проблемы в отношениях отсутствуют? Ответ: Да, вы правы, проблемы в семье, независимо от ее социального статуса, накладываются на поведение ребенка в коллективе. Поэтому так важно, чтобы родители посещали родительскую Академию, где раскрываются вопросы особенностей обучения в нашей школе и воспитания. Чтобы родители стали более осознанно относиться к «профессии родителя». Чтобы сложились честные и доверительные отношения между родителями и педагогом. Чтобы СОВМЕСТНЫМИ усилиями помочь ребенку преодолеть некоторые негативные моменты и в его поведении, и в социальных взаимоотношениях в классе, если таковые возникают, потому что вальдорфская школа - не панацея от проблем. но большие возможности к их пониманию и разрешению. Зато, благодаря тому, что в классах учатся дети из семей с разным достатком, разного социального статуса, у детей формируется здоровое чувство жизни, понимание того, что в этом большом мире есть место и слабым , и сильным, и бедным, и богатым. Для детей это большой, важный опыт."
