            - text: С 29 сентября начинаем ЗАНЯТИЯ ПО ПОДГОТОВКЕ К ШКОЛЕ!
            - img "✨" [ref=f6e64]
            - text: Дорогие родители! Если ваш ребенок в следующем году идет в школу, очень важно не торопить его взросление, сохранить живой интерес к учебе и укрепить уверенность в себе через реальные дела. В этом возрасте ребенку особенно нужен ритм, тепло и возможность делать что-то своими руками. Так, шаг за шагом, укрепляется внутренняя опора — то глубокое внутреннее чувство, что мир добр, а я справлюсь. Психологи называют это базовым доверием; в вальдорфской педагогике мы говорим о крепкой воле и здоровом чувстве «Я», которое растет из живого опыта, а не из ранних интеллектуальных нагрузок. Меня зовут Ирина Аркадьевна Толстых. Я — вальдорфский педагог, и сейчас я набираю группу детей на занятия по подготовке к школе. Что будет?
            - img "✨" [ref=f6e65]
            - text: Ритмические упражнения Упражнения на развитие равновесия и координации, игры на внимание и осязание. Стихи, песни, жестовые и пальчиковые игры.
            - img "✨" [ref=f6e66]
            - text: Творческая деятельность Живопись, рукоделие, лепка из воска и глины.
            - img "✨" [ref=f6e67]
            - text: Подготовка к письму Рисование блоками. Что это дает ребенку?
            - img "✨" [ref=f6e68]
            - text: "Уверенность: «Я умею, я справляюсь»."
            - img "✨" [ref=f6e69]
            - text: Интерес к учебе, который не выгорает к первому классу.
            - img "✨" [ref=f6e70]
            - text: Крепкую руку, внимательное восприятие, развитую речь.
            - img "✨" [ref=f6e71]
            - text: Умение быть в группе, слышать другого и сотрудничать.
            - img "✨" [ref=f6e72]
            - text: "Мягкий, бережный переход от игры к учебной деятельности. Расписание занятий: С 29 сентября, 2 раза в неделю по вторникам и пятницам, с 16:00 до 17:30 Стоимость: Пробное занятие можно оплатить разово - 800р за 1,5 часа. Далее приобретается абонемент: 8 занятий - 6400р Адрес проведения: \"Самоцвет\", г. Екатеринбург, ул.8 марта 194б, второй этаж, третий пролет Если вы чувствуете, что вашему ребенку нужен именно такой бережный и живой путь к школе, — приходите знакомиться. Количество мест в группе ограничено. Контакты для записи и вопросов: 89049887039"
            - link "Ксения" [ref=f6e73] [cursor=pointer]:
              - /url: https://vk.ru/kseniania
