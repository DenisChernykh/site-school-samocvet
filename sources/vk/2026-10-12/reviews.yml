                - img "🌻" [ref=f5e68]
                - text: "ЕЛИЗАВЕТА МОРОЗОВА:"
                - img "🌿" [ref=f5e69]
                - text: "В 2018-19 учебном году моя дочка пошла в Вальдорфскую Школу \"Самоцвет\", которая начиналась как Инициатива Родителей. Мы - родители - потрудились и оборудовали класс, как Подвижную Классную Комнату (ПКК). Это такие лавочки, за которыми дети сидят на специальных плотных подушках, набитых гречневой шелухой (у нас был сосновый опил). Благодаря этому им легче было войти в учебный процесс, оставаясь такими же живыми и подвижными детьми. ПКК не вынуждала их принимать однообразное положение на длительные отрезки времени в течение всего учебного дня. Дети могли под руководством учителя переставлять лавочки и подушки и садиться, то в круг, то как за партами, то вообще освобождать пространство для музыкально-ритмической игры. На переменке они могли построить из лавок домик, \"базу\", укрытие,корабль... тем самым успевая воплощать свободную игру. Лавочки и подушки использовались и на подвижных играх в разнообразных вариантах: дети пролезали под ними, перепрыгивали, прыгали с них, оббегали \"змейкой\", ползали, подтягиваясь руками, ходили по ним... А когда были праздники лавочки сдвигали вместе, превращая их в стол и все мы за ним помещались."
                - img "🌿" [ref=f5e70]
                - text: "Моя дочка с радостью учится и вот ещё на середине летних каникул спрашивает: \"А когда в школу? \"..."
                - img "🌿" [ref=f5e71]
                - text: У неё есть любимые предметы - "подвижные игры" и "математика" (арифметика). Она всегда с радостью показывает мне свои большие тетради, где они рисовали мелками образы букв, зарисовывали, рассказанные учителем, истории или придуманные ими самими задачки по арифметике.
                - img "🌿" [ref=f5e72]
                - text: Я отмечаю её живое воображение, способность увидеть живые картины в окружающем мире - в домах, предметах быта, машинах, деревьях, веточках, цветах и пр. она находит целый мир образов.
                - img "🌿" [ref=f5e73]
                - text: Считаю, что вальдорфская педагогика способствует этому благодаря своему, адекватному потребностям ребёнка, подходу. Ведь фантазия, её здоровое развитие, впоследствии помогает формироваться в ребёнке, в человеке, живому мышлению - не шаблонному (цепляющемуся за то, как надо, за известные алгоритмы), но смелому мышлению, которое способно найти, открыть нечто новое!
                - img "🌿" [ref=f5e74]
                - text: Мне очень нравится, что дети сами придумывали задачи и находили варианты решения, сочиняли истории, учились наблюдать и каждое утро рассказывали о своих наблюдениях за окружающим миром. А учитель всегда мотивировала их учебный интерес вопросами, а ведь таким способом дети и сами учатся задавать себе вопросы...
                - img "🌿" [ref=f5e75]
                - text: К середине года дети сдружились, стали поддерживать друг друга... И это тоже благодаря усилиям педагогов на таких занятиях ,как живопись (социальная живопись), подвижные игры, эвритмия, благодаря классному учителю и его педагогическим историям, и конечно благодаря нам, родителям, ведь мы все организуем и участвуем в совместных походах, праздниках, мероприятиях (сдача макулатуры, благотворительные ярмарки...).
                - img "🌿" [ref=f5e76]
                - text: Я очень рада, что мой ребёнок изучает иностранный язык методом погружения - учитель полностью ведёт урок на немецком (в этом году будет и английский). Вижу результаты - все бытовые фразы,названия частей тела, овощей, фруктов периодически используются в жизни и не забудутся, так как это информация полученная из опыта, из собственных переживаний, а не как отдельный файлик, который надо запомнить...
                - img "🌿" [ref=f5e77]
                - text: Считаю, что школа должна быть ориентирована на развитие человеческого в человеке, подходы должны соответствовать возрастным потребностям ребёнка, учителя - постоянно развиваться сами и иметь определённую творческую свободу в подаче материала. Вальдорфская педагогика отвечает этим запросам. Я искренне желаю школе "Самоцвет" развития и процветания и нам вместе с ней!
