              - generic [ref=f5e236]:
                - text: Мы только новички в этой школе. Очень долго выбирали, куда пойти. Для меня важна атмосфера, которая внутри классов. Отношение учителей к детям. Тк я вижу, сколько ,,сломанных,, взрослых у которых большая часть травм из школьного возраста. Поэтому это был один из самых важных критериев.
                - img "💥" [ref=f5e237]
