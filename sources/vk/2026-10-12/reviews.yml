            - generic [ref=f5e138]:
              - generic [ref=f5e139]: "Отзыв нашей дорогой мамы Лидии о школе! \" С сентября 2020 года мой старший сын Димочка стал ходить в вальдорфскую школу «Самоцвет». Первый класс он проучился в общеобразовательной школе. В новую школу он поступил во 2-3 класс. Что бы хотелось сказать? Вот уже прошло 8 месяцев его учебы, и я вижу, что в новой школе ребенку очень и очень нравится! Школа – необычная, с творческим подходом к обучению. К каждому ребенку применяется индивидуальный подход. Видно, что учителя любят своих учеников, заботятся о них, радуются каждому их успеху! Мне очень нравится, что учителя очень бережно и внимательно относятся к каждому ребенку. На родительских собраниях нам рассказывают, у кого-что получается, у кого-какие «слабые» места. Педагоги следят за душевным равновесием ребенка, дают интересные и жизненные домашние задания. Мне нравится, что в школе занимаются не только обучением, но и воспитанием. Есть не только учеба, но и много интересного – ребята ходят в походы, на физкультуре (предмет называется «подвижные игры») ребята катаются на лыжах и коньках, на Рождество дети готовили 2 небольшие постановки - одну на русском языке, другую – на английском. 3 дня в неделю у них – продленка. В один из этих дней дети готовят себе обед. Чем дальше, тем интереснее наблюдать за процессом. В вальдорфских школах принято изучать предметы по эпохам. Каждая эпоха длится от 2 до 4 недель. В сентябре у них была эпоха ремесел. Началась эта эпоха с выезда на 5 дней в сельскую местность. Ребенок приехал оттуда в полном восторге! Они ездили в кузницу, в эко-ферму: «Никольская слобода», готовили сами сыр, кормили домашних птиц, сами ковали железо. Эмпирически проживали многие трудовые процессы. В октябре мы ездили в поход на Каменные палатки. Дети участвовали в квесте, готовили напиток храбрости. В ноябре - декабре дети готовились к выступлению. И 25 декабря у них была рождественская ярмарка, участие в которой ребенок до сих пор вспоминает с теплотой и радостью. Удивительно то, что на уроках музыки они играют на флейтах, на уроках английского языка они много играют. За эти месяцы ребенок мне ни разу не сказал, что он не хочет в школу. А к концу новогодних каникул мне сказал по секрету, что уже хочется в школу. Вижу, что учителя так выстраивают свои уроки, чтобы детям было интересно. И это здорово!!! \""
