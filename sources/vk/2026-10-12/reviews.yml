            - generic [ref=f5e103]:
              - generic [ref=f5e104]:
                - img "🌻" [ref=f5e105]
                - text: "НАТАЛЬЯ КРАВЧЕНКО:"
                - img "🌿" [ref=f5e106]
                - text: Здравствуйте! Я - мама троих сыновей. Со старшим сыном, Владиславом, мы планировали сначала пойти в обычную школу. Год он ходил на подготовительные занятия с огромным нежеланием, но когда однажды во время открытого урока сыну сделали больше 10 замечаний за то, что он не сидел за партой по струнке смирно, то я поняла - обычная система не для нас! И мы очень рады, что за 2 недели до 1 сентября узнали про школу «Самоцвет»!
                - img "🌿" [ref=f5e107]
                - text: "Было, конечно, очень страшно, так как школа - новая, а про Вальдорфское образование мы слышали в первый раз, но мы рискнули, о чем до сегодняшнего дня ни разу не пожалели! За весь год обучения Владислав НИ РАЗУ утром, когда я его будила, не сказал: «Мама, я не хочу в школу»!!! За целый год всего один"
                - img "😃" [ref=f5e108]
                - text: больничный, а раньше мы с них не вылезали! И хотя не все в обучении ему давалось легко, педагоги всегда подбадривали меня и Влада, что все получится! Вместо безразличия и унижения, которые были в гимназии... И действительно ведь, все получалось!
                - img "🌿" [ref=f5e109]
                - text: У Владика очень развилось образное и креативное мышление, он стал хорошо рисовать, стал активнее и увереннее в себе. Мы с мужем очень боялись, что с началом школьной жизни у сына и у нас с ним начнется «новая» жизнь - все вечера за уроками, вечные поучения ребенку, испорченные отношения с ним, и были приятно удивлены, что уроков почти не было, предметы преподавались таким образом, что ребенок все усваивал на уроке, дома лишь немного повторяли. Мамочки, с детьми которых сын ходил в садик, с завистью слушали о том, как мы учимся и какая атмосфера царит в школе, и рассказывали, как их еженедельно отчитывает учитель, что они вечно себя чувствуют в чем-то виноватыми.. Вобщем, и дети, и родители к концу учебного года - с неврозами...
                - img "🌿" [ref=f5e110]
                - text: Поэтому смело скажу - если Вы - мамочка, которая хочет своему ребенку хорошее образование и всестороннее развитие, и чтобы он при этом остался здоровым и жизнерадостным (и вы в том числе
                - img "😉" [ref=f5e111]
                - text: ), тогда Вам точно в школу «Самоцвет»! И не сомневайтесь, что сделаете правильный выбор!
